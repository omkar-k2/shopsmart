name: Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Testing across the versions required by your lab
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          # Caching removed to prevent "Dependencies lock file not found" error

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        # This will fail if your package.json doesn't have a "lint" script
        run: npm run lint

      - name: Run Tests
        # This will fail if your package.json doesn't have a "test" script
        run: npm run test

      - name: Build Project
        run: npm run build
